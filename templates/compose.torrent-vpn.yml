services:
  torrent-vpn:
    restart: unless-stopped
    profiles: [torrents]
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv6.conf.all.disable_ipv6: '1'
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      WIREGUARD_IMPLEMENTATION: userspace
      FIREWALL: 'on'
      FIREWALL_INPUT_PORTS: '18427'
      DNS_ADDRESS: 127.0.0.1
      UPDATER_PERIOD: '0'
    volumes:
      - type: bind
        source: ./private/torrent-vpn/wg0.conf
        target: /gluetun/wireguard/wg0.conf
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    networks: [home]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: [CMD, /gluetun-entrypoint, healthcheck]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  qbittorrent:
    networks: !reset []
    network_mode: service:torrent-vpn
    volumes:
      - ./templates/torrent-resolv.conf:/etc/resolv.conf:ro,z
    depends_on:
      torrent-vpn:
        condition: service_healthy
        restart: true
