services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded
    restart: unless-stopped
    network_mode: host
    env_file: ./private/ai-webui.env
    environment:
      HOST: '172.30.44.1'
      PORT: '28413'
      WEBUI_URL: 'https://ai.${DOMAIN:?required}'
      WEBUI_AUTH: 'true'
      ENABLE_SIGNUP: 'false'
      ENABLE_PERSISTENT_CONFIG: 'false'
      ENABLE_OPENAI_API: 'false'
      ENABLE_OLLAMA_API: 'true'
      ENABLE_DIRECT_CONNECTIONS: 'false'
      ENABLE_VERSION_UPDATE_CHECK: 'false'
      OLLAMA_BASE_URLS: 'http://127.0.0.1:11435${AI_REMOTE_OLLAMA_URL:+;}${AI_REMOTE_OLLAMA_URL:-}'
    volumes:
      - /srv/den/ai/webui:/app/backend/data:z
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: [CMD-SHELL, "curl --silent --fail http://$${HOST}:$${PORT}/health | jq -ne 'input.status == true'"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5
