name: DEN checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq openssl shellcheck restic python3-pykeepass
      - name: Verify scripts, stack and encrypted recovery
        run: bash tests/run.sh